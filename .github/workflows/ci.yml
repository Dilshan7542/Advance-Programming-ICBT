name: Sunrise Dental Clinic CI

on:
  push:
    branches: [ "main", "develop", "prod" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn --batch-mode clean test
      - name: Build WAR
        run: mvn --batch-mode -DskipTests package
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic-war
          path: target/sunrise-dental-clinic.war
